name: iOS client
on:
  push:
    paths: ['ios/**', 'scripts/ios-client-test.ts', 'electron/companion.ts', 'electron/library.ts', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Exercise the Swift client against the desktop service
        run: npx --no-install tsx scripts/ios-client-test.ts
      - name: Build for iPhone and iPad
        run: xcodebuild -project ios/Satchel.xcodeproj -scheme Satchel -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test the app against a paired computer on iPhone Simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | jq -er '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl bootstatus "$device" -b
          build=(-project ios/Satchel.xcodeproj -scheme Satchel -destination "id=$device" -derivedDataPath "$RUNNER_TEMP/ios-build" -parallel-testing-enabled NO)
          xcodebuild "${build[@]}" build-for-testing
          offer="$RUNNER_TEMP/satchel-test-offer"
          node --import tsx scripts/ios-client-test.ts --serve-ui "$offer" &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          for i in {1..30}; do [[ -s "$offer" ]] && break; sleep 1; done
          export TEST_RUNNER_SATCHEL_TEST_OFFER="$(cat "$offer")"
          xcodebuild "${build[@]}" -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" test-without-building
          ditto -c -k --keepParent "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/Satchel.app" "$RUNNER_TEMP/Satchel-iOS-Simulator.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iOS-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Satchel-iOS-Simulator
          path: ${{ runner.temp }}/Satchel-iOS-Simulator.zip
          if-no-files-found: error
