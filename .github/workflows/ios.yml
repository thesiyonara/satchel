name: iOS client
on:
  push:
    paths: ['ios/**', 'scripts/ios-client-test.ts', 'electron/companion.ts', 'electron/library.ts', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    runs-on: macos-latest
    env:
      SIMULATOR_FAMILY: ${{ matrix.device }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Start the simulator
        run: |
          device=$(xcrun simctl list devices available -j | jq -er --arg family "$SIMULATOR_FAMILY" '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith($family))][0].udid')
          echo "SATCHEL_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
      - name: Exercise the Swift client against the desktop service
        if: matrix.device == 'iPhone'
        run: npx --no-install tsx scripts/ios-client-test.ts
      - name: Build for iPhone and iPad
        if: matrix.device == 'iPhone'
        run: xcodebuild -project ios/Satchel.xcodeproj -scheme Satchel -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test the simulator app against a paired computer
        run: |
          set -euo pipefail
          device="$SATCHEL_SIMULATOR"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time 9:41
          build=(-project ios/Satchel.xcodeproj -scheme Satchel -destination "id=$device" -derivedDataPath "$RUNNER_TEMP/ios-build" -parallel-testing-enabled NO)
          xcodebuild "${build[@]}" build-for-testing
          app="$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/Satchel.app"
          jq -e '.actions | has("SaveSatchelNoteIntent") and has("GetSatchelPasteboardIntent") and has("SetSatchelPasteboardIntent") and has("UploadSatchelFileIntent")' "$app/Metadata.appintents/extract.actionsdata"
          test -e "$app/PlugIns/SatchelShare.appex/SatchelShare"
          test -e "$app/PlugIns/SatchelWidgets.appex/SatchelWidgets"
          for bundle in "$app" "$app/PlugIns/SatchelShare.appex"; do
            /usr/libexec/PlistBuddy -c 'Print SatchelPairingAccessGroup' "$bundle/Info.plist" | grep -F 'local.satchel.phone.pairing'
          done
          node --import tsx scripts/ios-client-test.ts --serve-ui &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          xcodebuild "${build[@]}" -test-timeouts-enabled YES -maximum-test-execution-time-allowance 240 -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" test-without-building
          ditto -c -k --keepParent "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/Satchel.app" "$RUNNER_TEMP/Satchel-iOS-Simulator.zip"
      - name: Collect simulator screenshots
        if: always() && env.SATCHEL_SIMULATOR != ''
        run: |
          data=$(xcrun simctl get_app_container "$SATCHEL_SIMULATOR" local.satchel.phone.uitests.xctrunner data)
          cp -R "$data/Documents/SatchelScreenshots" "$RUNNER_TEMP/iPhone-screenshots"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.device }}-screenshots
          path: ${{ runner.temp }}/iPhone-screenshots/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.device }}-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.device == 'iPhone'
        with:
          name: Satchel-iOS-Simulator
          path: ${{ runner.temp }}/Satchel-iOS-Simulator.zip
          if-no-files-found: error
