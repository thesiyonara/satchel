name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'After the build: none, draft (a draft release for review) or publish (a published release, and installed apps update). The tag v<package.json version> is created at this commit.'
        type: choice
        options: [none, draft, publish]
        default: none
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run privacy:check
      - run: npm run fetch:engine
      - run: npm run build
      - run: npm test
      - run: npm run test:sync
      - if: runner.os == 'Windows'
        run: npm run test:features
      - run: npm run test:updates
      - if: runner.os == 'Windows'
        run: npm run test:web
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - if: runner.os == 'Windows'
        run: node scripts/package-smoke.mjs
      - if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'macOS'
        run: node scripts/package-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Satchel-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  # On a version tag, or a manual run that asks for a release, gather both platforms' packages and hand
  # them to scripts/ci-release.sh: it writes the checksum file the in-app updater verifies against and
  # opens a draft release for a maintainer to review (or publishes it, when a manual run asks for that),
  # or, when the release already exists, adds only the packages it lacks. A manual run names the tag
  # after package.json; creating the release creates the tag at this commit.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != 'none')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Create a draft release, or add the packages a published release lacks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then tag="v$(node -p "require('./package.json').version")"; else tag="$GITHUB_REF_NAME"; fi
          bash scripts/ci-release.sh "$tag" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "${{ inputs.release == 'publish' && 'publish' || 'draft' }}"
